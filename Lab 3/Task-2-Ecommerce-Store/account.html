<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Abdulraheem">
  <meta name="description" content="Your Kashi Ghar account and orders.">
  <title>My account · Kashi Ghar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">
  <div id="site-nav"></div>

  <header class="page-head py-4">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb small mb-1">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">My account</li>
        </ol>
      </nav>
      <h1 class="h2 mb-0">My account</h1>
    </div>
  </header>

  <main class="container py-4">
    <div class="row g-4">
      <!-- Profile -->
      <div class="col-lg-4">
        <div class="card p-4" id="profileCard"></div>
      </div>

      <!-- Orders -->
      <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 mb-0">Order history</h2>
          <span class="badge rounded-pill text-bg-light border" id="orderCount"></span>
        </div>
        <div class="accordion" id="ordersAccordion"></div>
        <div class="empty-state text-center py-5 d-none" id="noOrders">
          <i class="bi bi-box-seam display-5 text-body-secondary"></i>
          <p class="mt-3 mb-3">You haven’t placed any orders yet.</p>
          <a href="index.html#shop" class="btn btn-primary">Start shopping</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/account.js"></script>
</body>
</html>

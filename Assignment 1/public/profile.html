<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Abdul Raheem">
  <title>Profile · ConnecFriend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="shell-nav"></div>

  <main class="app-main">
    <div class="container-xxl py-4 px-3 px-md-4">
      <div id="notFound" class="d-none"></div>

      <div id="profileArea">
        <!-- Header card -->
        <section class="card border-0 shadow-sm mb-4 overflow-hidden">
          <div class="login-hero" style="height:110px"></div>
          <div class="card-body px-3 px-md-4 pt-0">
            <div class="d-flex flex-wrap align-items-end gap-3" style="margin-top:-48px">
              <div class="position-relative" id="pictureBox"></div>
              <div class="flex-grow-1 pb-1">
                <h1 class="h3 fw-bold mb-0" id="profileName"></h1>
                <p class="text-body-secondary mb-0" id="profileHandle"></p>
              </div>
              <div class="d-flex flex-wrap gap-2 pb-1" id="profileActions"></div>
            </div>
          </div>
        </section>

        <div class="row g-4">
          <!-- Personal information -->
          <div class="col-lg-4">
            <section class="card border-0 shadow-sm mb-4">
              <div class="card-header bg-transparent border-0 pt-3 d-flex justify-content-between align-items-center">
                <h2 class="h6 fw-semibold mb-0">Personal information</h2>
                <button class="btn btn-sm btn-light d-none" id="editInfoBtn" data-bs-toggle="modal" data-bs-target="#editModal"><i class="bi bi-pencil me-1"></i>Edit</button>
              </div>
              <div class="card-body pt-1">
                <p class="text-body-secondary small" id="profileBio"></p>
                <ul class="list-unstyled small mb-0 d-grid gap-2" id="profileInfo"></ul>
              </div>
            </section>

            <section class="card border-0 shadow-sm d-none" id="ignoreCard">
              <div class="card-header bg-transparent border-0 pt-3">
                <h2 class="h6 fw-semibold mb-0">Ignore list</h2>
                <p class="small text-body-secondary mb-0">People here cannot send you friend requests or messages.</p>
              </div>
              <ul class="list-group list-group-flush" id="ignoreList"></ul>
            </section>
          </div>

          <!-- Friends + posts -->
          <div class="col-lg-8">
            <section class="card border-0 shadow-sm mb-4" id="friends">
              <div class="card-header bg-transparent border-0 pt-3 d-flex justify-content-between align-items-center">
                <h2 class="h6 fw-semibold mb-0">Friends <span class="badge text-bg-light border ms-1" id="friendCount">0</span></h2>
                <span class="small text-body-secondary" id="ratingHint"></span>
              </div>
              <div class="card-body pt-1">
                <div class="row row-cols-1 row-cols-md-2 g-3" id="friendGrid"></div>
              </div>
            </section>

            <h2 class="h5 fw-bold mb-3" id="postsTitle">News</h2>
            <div class="d-grid gap-3" id="profilePosts"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit personal information -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="editForm" novalidate>
        <div class="modal-header"><h2 class="modal-title fs-5" id="editTitle">Edit personal information</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label" for="fName">Full name</label>
            <input class="form-control" id="fName" name="name" maxlength="60"><div class="invalid-feedback"></div></div>
          <div class="mb-3"><label class="form-label" for="fWork">Work / study</label>
            <input class="form-control" id="fWork" name="work" maxlength="160"><div class="invalid-feedback"></div></div>
          <div class="mb-3"><label class="form-label" for="fCity">Current city</label>
            <input class="form-control" id="fCity" name="city" maxlength="60"><div class="invalid-feedback"></div></div>
          <div><label class="form-label" for="fBio">About</label>
            <textarea class="form-control" id="fBio" name="bio" rows="3" maxlength="160"></textarea><div class="invalid-feedback"></div></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveInfoBtn" data-busy="Saving">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <input type="file" id="pictureInput" accept="image/png,image/jpeg,image/gif,image/webp" class="d-none">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>

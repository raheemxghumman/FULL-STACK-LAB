<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Abdul Raheem">
  <title>Messages · ConnecFriend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="shell-nav"></div>

  <main class="app-main">
    <div class="container-xxl py-3 py-lg-4 px-3 px-md-4">
      <div class="card border-0 shadow-sm chat-card">
        <div class="row g-0 h-100">

          <!-- Conversation list -->
          <section class="col-md-5 col-xl-4 border-end d-flex flex-column h-100" id="listPane" aria-label="Conversations">
            <div class="p-3 border-bottom">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h5 fw-bold mb-0">Messages</h1>
                <span class="badge rounded-pill text-bg-light border" id="connStatus"><i class="bi bi-circle-fill me-1 small"></i>Connecting…</span>
              </div>
              <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#newChatModal"><i class="bi bi-pencil-square me-1"></i>New message</button>
            </div>
            <div class="list-group list-group-flush flex-grow-1 overflow-auto" id="conversationList"></div>
          </section>

          <!-- Active conversation -->
          <section class="col-md-7 col-xl-8 d-none d-md-flex flex-column h-100" id="chatPane" aria-label="Conversation">
            <div class="d-flex flex-column align-items-center justify-content-center text-center h-100 p-4" id="chatEmpty">
              <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10 text-primary mb-3" style="width:72px;height:72px"><i class="bi bi-chat-heart fs-2"></i></span>
              <h2 class="h5 fw-semibold">Your private messages</h2>
              <p class="text-body-secondary small mb-3" style="max-width:340px">Pick a conversation, or start a new one with a friend or any other ConnecFriend member.</p>
              <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newChatModal">Start a conversation</button>
            </div>

            <div class="d-none flex-column h-100" id="chatActive">
              <header class="d-flex align-items-center gap-3 p-3 border-bottom">
                <button class="btn btn-light btn-sm d-md-none" id="backBtn" aria-label="Back to conversations"><i class="bi bi-arrow-left"></i></button>
                <a id="chatAvatarLink" href="#"></a>
                <div class="flex-grow-1 min-w-0 lh-sm">
                  <a id="chatName" href="#" class="fw-semibold text-body text-decoration-none d-block text-truncate"></a>
                  <span class="small text-body-secondary" id="chatSub"></span>
                </div>
                <span id="chatRelation"></span>
              </header>

              <div class="chat-scroll flex-grow-1 p-3 bg-body-tertiary" id="messageList" aria-live="polite"></div>

              <div class="px-3 pb-1 pt-2 small text-body-secondary d-none" id="typingRow">
                <span class="d-inline-flex align-items-center gap-1"><span class="typing-dot rounded-circle bg-secondary d-inline-block"></span><span class="typing-dot rounded-circle bg-secondary d-inline-block"></span><span class="typing-dot rounded-circle bg-secondary d-inline-block"></span></span>
                <span class="ms-1" id="typingText"></span>
              </div>

              <form class="p-3 border-top" id="sendForm" novalidate>
                <div class="input-group">
                  <textarea class="form-control" id="messageInput" rows="1" maxlength="1000" placeholder="Write a message… (Enter to send, Shift+Enter for a new line)" aria-label="Message" style="resize:none"></textarea>
                  <button class="btn btn-primary px-3" type="submit" id="sendBtn" aria-label="Send"><i class="bi bi-send-fill"></i></button>
                </div>
                <div class="d-flex justify-content-between mt-1">
                  <span class="small text-danger" id="sendError" role="alert"></span>
                  <span class="small text-body-secondary" id="msgCounter">0 / 1000</span>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <!-- New conversation: any member, not only friends -->
  <div class="modal fade" id="newChatModal" tabindex="-1" aria-labelledby="newChatTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title fs-5" id="newChatTitle">New message</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <p class="small text-body-secondary">You can message your friends and any other member.</p>
          <input type="search" class="form-control mb-3" id="memberSearch" placeholder="Search members" aria-label="Search members">
          <div class="list-group" id="memberList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>

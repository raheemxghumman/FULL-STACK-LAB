<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Abdul Raheem">
  <title>News feed · ConnecFriend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="shell-nav"></div>

  <main class="app-main">
    <div class="container-xxl py-4 px-3 px-md-4">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
        <div>
          <p class="text-body-secondary small mb-1" id="greetingDate"></p>
          <h1 class="h3 fw-bold mb-0" id="greeting">News feed</h1>
        </div>
      </div>

      <div class="row g-4">
        <!-- Feed column -->
        <div class="col-xl-8">

          <!-- Share news -->
          <section class="card border-0 shadow-sm mb-4" aria-labelledby="shareTitle">
            <div class="card-body p-3 p-md-4">
              <h2 class="h6 fw-semibold mb-3" id="shareTitle"><i class="bi bi-broadcast text-primary me-2"></i>Share news with your friends</h2>
              <form id="shareForm" novalidate>
                <div class="d-flex gap-3">
                  <div id="composerAvatar"></div>
                  <div class="flex-grow-1">
                    <textarea class="form-control" id="postText" rows="3" maxlength="500" placeholder="What's new? Share an update, an achievement or a question…" aria-describedby="postCounter"></textarea>
                    <div class="invalid-feedback" id="postTextFeedback"></div>
                    <div class="form-text text-end" id="postCounter">0 / 500</div>
                  </div>
                </div>

                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mt-2">
                  <div>
                    <span class="small fw-semibold me-2">Share with</span>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Audience">
                      <input type="radio" class="btn-check" name="audience" id="audAll" value="all" checked>
                      <label class="btn btn-outline-primary" for="audAll"><i class="bi bi-people-fill me-1"></i>All friends</label>
                      <input type="radio" class="btn-check" name="audience" id="audSome" value="some">
                      <label class="btn btn-outline-primary" for="audSome"><i class="bi bi-person-check me-1"></i>Some friends</label>
                    </div>
                  </div>
                  <button type="submit" class="btn btn-primary px-4" id="shareBtn" data-busy="Sharing"><i class="bi bi-send me-1"></i>Share</button>
                </div>

                <!-- Friend picker for "Some friends" -->
                <div class="collapse" id="friendPicker">
                  <div class="border rounded-3 p-3 mt-3 bg-body-tertiary">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <span class="small fw-semibold">Choose friends <span class="text-body-secondary fw-normal" id="pickedCount">(0 selected)</span></span>
                      <span class="small"><a href="#" id="pickAll">Select all</a> · <a href="#" id="pickNone">Clear</a></span>
                    </div>
                    <div class="row row-cols-1 row-cols-sm-2 g-2" id="friendChecks"></div>
                    <div class="text-danger small mt-2 d-none" id="audienceError"></div>
                  </div>
                </div>
              </form>
            </div>
          </section>

          <!-- Feed header -->
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h5 fw-bold mb-0">Latest from your friends</h2>
            <div class="btn-group btn-group-sm" role="group" aria-label="Sort feed">
              <input type="radio" class="btn-check" name="order" id="orderLogin" value="login" checked>
              <label class="btn btn-outline-secondary" for="orderLogin" data-bs-toggle="tooltip" data-bs-title="Friends who logged in most recently come first">Recently active</label>
              <input type="radio" class="btn-check" name="order" id="orderRecent" value="recent">
              <label class="btn btn-outline-secondary" for="orderRecent">Newest posts</label>
            </div>
          </div>

          <div id="feed" class="d-grid gap-3" aria-live="polite"></div>
        </div>

        <!-- Right column -->
        <div class="col-xl-4">
          <section class="card border-0 shadow-sm mb-4" aria-labelledby="friendsTitle">
            <div class="card-header bg-transparent border-0 pt-3 d-flex justify-content-between align-items-center">
              <h2 class="h6 fw-semibold mb-0" id="friendsTitle">Friends · by last login</h2>
              <a href="profile.html#friends" class="small">See all</a>
            </div>
            <ul class="list-group list-group-flush" id="friendList"></ul>
          </section>

          <section class="card border-0 shadow-sm" aria-labelledby="suggestTitle">
            <div class="card-header bg-transparent border-0 pt-3 d-flex justify-content-between align-items-center">
              <h2 class="h6 fw-semibold mb-0" id="suggestTitle">People you may know</h2>
              <a href="people.html" class="small">Find people</a>
            </div>
            <ul class="list-group list-group-flush" id="suggestions"></ul>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
